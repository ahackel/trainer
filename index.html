<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Vokabel Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #7c3aed 0%, #ec4899 50%, #f59e0b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2em;
        }

        .stats {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
            padding: 25px;
            background: #fef9e7;
            border-radius: 20px;
        }

        .smiley {
            font-size: 4em;
            transition: transform 0.3s ease;
        }

        .smiley:hover {
            transform: scale(1.1);
        }

        .card {
            background: #fef3c7;
            border-radius: 25px;
            padding: 40px;
            margin-bottom: 20px;
            text-align: center;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .word {
            font-size: 2.5em;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .progress {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            border: 3px solid #ddd;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #7c3aed;
        }

        input[type="text"].correct {
            border-color: #10b981;
            background-color: #d1fae5;
        }

        input[type="text"].incorrect {
            border-color: #ef4444;
            background-color: #fee2e2;
        }

        .feedback {
            min-height: 30px;
            margin-bottom: 20px;
            font-size: 1.1em;
            font-weight: bold;
        }

        .feedback.correct {
            color: #10b981;
        }

        .feedback.incorrect {
            color: #f59e0b;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 15px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #7c3aed;
            color: white;
        }

        .btn-primary:hover {
            background: #6d28d9;
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #94a3b8;
            color: white;
        }

        .btn-secondary:hover {
            background: #64748b;
            transform: translateY(-2px);
        }

        .btn-secondary:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .filter {
            margin-bottom: 30px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab {
            flex: 1;
            padding: 12px 10px;
            font-size: 1em;
            font-weight: 600;
            color: #666;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            border-color: #7c3aed;
        }

        .tab.active {
            color: white;
            background: #7c3aed;
            border-color: #7c3aed;
        }

        .tab-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .tab-panel[hidden] {
            display: none;
        }

        .tab-panel label {
            font-size: 0.9em;
            color: #666;
        }

        .tab-panel select,
        .tab-panel input {
            padding: 10px 16px;
            font-size: 1em;
            border: 3px solid #ddd;
            border-radius: 15px;
            background: white;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-panel select {
            flex: 1;
        }

        .tab-panel input {
            width: 90px;
            text-align: center;
        }

        .tab-panel select:focus,
        .tab-panel input:focus {
            outline: none;
            border-color: #7c3aed;
        }

        .tab-panel select:hover,
        .tab-panel input:hover {
            border-color: #7c3aed;
        }

        /* iPad Portrait Optimization */
        @media only screen
        and (min-width: 768px)
        and (max-width: 1024px)
        and (orientation: portrait) {
            html {
                scroll-behavior: smooth;
            }

            body {
                padding: 20px;
                align-items: flex-start;
                padding-top: 20px;
            }

            .container {
                max-width: 700px;
                padding: 30px;
                margin: 0 auto;
            }

            h1 {
                font-size: 2.2em;
                margin-bottom: 20px;
            }

            .filter {
                margin-bottom: 20px;
            }

            .tab {
                padding: 14px 10px;
                font-size: 1.1em;
            }

            .tab-panel label {
                font-size: 1em;
            }

            .tab-panel select,
            .tab-panel input {
                padding: 12px 18px;
                font-size: 1.1em;
            }

            .stats {
                padding: 15px;
                margin-bottom: 20px;
            }

            .stat-label {
                font-size: 0.9em;
            }

            .stat-value {
                font-size: 1.6em;
            }

            .card {
                padding: 30px;
                border-radius: 15px;
                margin-bottom: 20px;
            }

            .progress {
                font-size: 1em;
                margin-bottom: 15px;
            }

            .word {
                font-size: 2.8em;
                margin-bottom: 20px;
            }

            .input-group {
                margin-bottom: 15px;
            }

            input[type="text"] {
                padding: 16px;
                font-size: 1.3em;
                border-width: 2px;
            }

            .feedback {
                min-height: 30px;
                font-size: 1.1em;
                margin-bottom: 15px;
            }

            .buttons {
                gap: 12px;
            }

            button {
                padding: 16px;
                font-size: 1em;
            }
        }

        /* Ensure input stays visible when keyboard appears */
        @supports (-webkit-touch-callout: none) {
            input[type="text"]:focus {
                transform: translateY(-20px);
                transition: transform 0.2s ease;
            }
        }

        /* Completion screen styles */
        .completion-screen {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .completion-screen.active {
            display: block;
            animation: fadeInBounce 0.6s ease-out;
        }

        .completion-screen h2 {
            color: #10b981;
            font-size: 2.5em;
            margin-bottom: 20px;
            animation: bounce 0.8s ease-in-out;
        }

        .completion-screen .completion-message {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .completion-screen .session-stats {
            background: #d1fae5;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .completion-screen .session-stats h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.3em;
        }

        .completion-screen .session-stats p {
            font-size: 1.1em;
            color: #333;
            margin: 12px 0;
            font-weight: 500;
        }

        .completion-screen .new-session-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.3em;
            font-weight: bold;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .completion-screen .new-session-btn:hover {
            background: #6d28d9;
            transform: translateY(-3px);
        }

        .card.hidden {
            display: none;
        }

        /* Animations for kid-friendly feedback */
        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            10%, 30%, 50%, 70%, 90% {
                transform: translateX(-8px);
            }
            20%, 40%, 60%, 80% {
                transform: translateX(8px);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes fadeInBounce {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            50% {
                transform: scale(1.05);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        .bounce {
            animation: bounce 0.4s ease-in-out;
        }

        .fade-in-bounce {
            animation: fadeInBounce 0.5s ease-out;
        }

        /* Progress bar styles */
        .progress-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .progress-bar-wrapper {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            margin-bottom: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: #7c3aed;
            border-radius: 15px;
            transition: width 0.6s ease-out;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .progress-text {
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Vokabel Trainer</h1>

    <div class="filter">
        <div class="tabs">
            <button type="button" class="tab active" data-mode="all" onclick="setMode('all')">Alle</button>
            <button type="button" class="tab" data-mode="chapter" onclick="setMode('chapter')">Kapitel</button>
            <button type="button" class="tab" data-mode="pages" onclick="setMode('pages')">Seiten</button>
        </div>
        <div class="tab-panel" id="panel-chapter" hidden>
            <label for="chapter-select">Kapitel:</label>
            <select id="chapter-select" onchange="onFilterChange()"></select>
        </div>
        <div class="tab-panel" id="panel-pages" hidden>
            <label for="page-from">Von:</label>
            <input type="number" id="page-from" inputmode="numeric" onchange="onFilterChange()">
            <label for="page-to">Bis:</label>
            <input type="number" id="page-to" inputmode="numeric" onchange="onFilterChange()">
        </div>
    </div>

    <div class="stats">
        <div class="smiley" id="smiley">😊</div>
    </div>

    <div class="card" id="quiz-card">
        <div class="progress-container">
            <div class="progress-bar-wrapper">
                <div class="progress-bar-fill" id="progress-bar"></div>
            </div>
            <div class="progress-text" id="progress-text">5 von 5 verbleibend</div>
        </div>
        <div class="word" id="german-word">Laden...</div>

        <div class="input-group">
            <input
                    type="text"
                    id="answer-input"
                    placeholder="Gib die englische Übersetzung ein..."
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false"
            >
        </div>

        <div class="feedback" id="feedback"></div>

        <div class="buttons">
            <button class="btn-secondary" id="prev-btn" onclick="previousWord()">Zurück</button>
            <button class="btn-primary" id="check-btn" onclick="checkAnswer()">Prüfen</button>
            <button class="btn-success" id="next-btn" onclick="nextWord()" style="display:none;">Weiter</button>
        </div>
    </div>

    <div class="completion-screen" id="completion-screen">
        <h2>🎉 ⭐ Super gemacht! ⭐ 🎉</h2>
        <p class="completion-message">Fantastisch! Du hast alle Vokabeln gemeistert! 🌟</p>

        <div class="session-stats">
            <h3>📊 Deine Statistiken</h3>
            <p><strong>✅ Korrekte Antworten:</strong> <span id="session-correct">0</span></p>
            <p><strong>❌ Falsche Antworten:</strong> <span id="session-incorrect">0</span></p>
            <p><strong>🎯 Erfolgsquote:</strong> <span id="session-rate">0%</span></p>
        </div>

        <button class="new-session-btn" onclick="startNewSession()">🚀 Neue Session starten</button>
    </div>
</div>

<script src="data/vocabulary.js"></script>
<script>
    // All vocabulary pages, loaded once from data/vocabulary.js at startup.
    // Each page: { page: <number>, chapter: <string|null>, words: [{de, en}] }
    let allPages = [];

    // Current filter. mode: 'all' | 'chapter' | 'pages'.
    let filter = {mode: 'all', chapter: null, from: null, to: null};

    // Read the vocabulary from the global set by data/vocabulary.js (loaded via a
    // <script> tag in <head>). A script tag is used instead of fetch() so the page
    // works under file:// — opening index.html directly or running it offline on the
    // iPad home screen — where fetch() of a local file is blocked by the browser.
    function loadAllPages() {
        const data = window.VOCABULARY;
        if (!data || !Array.isArray(data.pages)) {
            throw new Error('data/vocabulary.js missing or has no "pages" array (run: npm run build)');
        }
        return data.pages;
    }

    // Build the {german, english} word list for the current filter.
    function loadVocabulary() {
        let pages;
        if (filter.mode === 'chapter') {
            pages = allPages.filter(p => p.chapter != null && p.chapter === filter.chapter);
        } else if (filter.mode === 'pages') {
            const from = filter.from, to = filter.to;
            pages = allPages.filter(p => p.page >= from && p.page <= to);
        } else {
            pages = allPages;
        }
        return pages
            .flatMap(p => p.words)
            .map(w => ({german: w.de, english: w.en}));
    }

    // Distinct chapters present in the data, in first-seen order.
    function availableChapters() {
        const seen = [];
        for (const p of allPages) {
            if (p.chapter != null && !seen.includes(p.chapter)) seen.push(p.chapter);
        }
        return seen;
    }

    // Populate the filter controls from the data and restore the saved filter.
    function initializeFilter() {
        const saved = JSON.parse(localStorage.getItem('vocabFilter') || 'null');

        // Chapter dropdown.
        const chapterSelect = document.getElementById('chapter-select');
        const chapters = availableChapters();
        chapterSelect.innerHTML = '';
        if (chapters.length === 0) {
            const opt = document.createElement('option');
            opt.textContent = 'Keine Kapitel vorhanden';
            opt.disabled = true;
            chapterSelect.appendChild(opt);
            chapterSelect.disabled = true;
        } else {
            chapters.forEach(ch => {
                const opt = document.createElement('option');
                opt.value = ch;
                opt.textContent = ch;
                chapterSelect.appendChild(opt);
            });
        }

        // Page range defaults to the full available range.
        const nums = allPages.map(p => p.page);
        const minPage = nums.length ? Math.min(...nums) : 0;
        const maxPage = nums.length ? Math.max(...nums) : 0;
        const fromInput = document.getElementById('page-from');
        const toInput = document.getElementById('page-to');
        fromInput.min = toInput.min = minPage;
        fromInput.max = toInput.max = maxPage;
        fromInput.value = minPage;
        toInput.value = maxPage;

        // Restore saved filter where the values are still valid.
        if (saved) {
            if (saved.mode === 'chapter' && chapters.includes(saved.chapter)) {
                chapterSelect.value = saved.chapter;
            }
            if (saved.mode === 'pages') {
                if (saved.from != null) fromInput.value = saved.from;
                if (saved.to != null) toInput.value = saved.to;
            }
            if (['all', 'chapter', 'pages'].includes(saved.mode)) {
                // chapter mode only makes sense when chapters exist
                filter.mode = (saved.mode === 'chapter' && chapters.length === 0) ? 'all' : saved.mode;
            }
        }

        applyFilterControls();
        reloadFromFilter();
    }

    // Read the current control values into `filter`.
    function readFilterControls() {
        const chapterSelect = document.getElementById('chapter-select');
        const fromInput = document.getElementById('page-from');
        const toInput = document.getElementById('page-to');

        filter.chapter = chapterSelect.disabled ? null : chapterSelect.value;

        let from = parseInt(fromInput.value, 10);
        let to = parseInt(toInput.value, 10);
        if (isNaN(from)) from = parseInt(fromInput.min, 10) || 0;
        if (isNaN(to)) to = parseInt(toInput.max, 10) || from;
        if (from > to) [from, to] = [to, from]; // tolerate reversed input
        filter.from = from;
        filter.to = to;
    }

    // Reflect `filter.mode` in the tab buttons and visible panel.
    function applyFilterControls() {
        document.querySelectorAll('.tab').forEach(tab => {
            tab.classList.toggle('active', tab.dataset.mode === filter.mode);
        });
        document.getElementById('panel-chapter').hidden = filter.mode !== 'chapter';
        document.getElementById('panel-pages').hidden = filter.mode !== 'pages';
    }

    // Switch tab.
    function setMode(mode) {
        filter.mode = mode;
        applyFilterControls();
        reloadFromFilter();
    }

    // A control (chapter dropdown / page inputs) changed.
    function onFilterChange() {
        reloadFromFilter();
    }

    // Re-read controls, persist, rebuild vocabulary and restart the session.
    function reloadFromFilter() {
        readFilterControls();
        localStorage.setItem('vocabFilter', JSON.stringify(filter));

        vocabulary = loadVocabulary();
        shuffledVocabulary = shuffleArray(vocabulary);
        remainingWords = [...shuffledVocabulary];
        masteredWords.clear();
        stats = {correct: 0, incorrect: 0};

        updateStats();
        document.getElementById('completion-screen').classList.remove('active');
        document.getElementById('quiz-card').classList.remove('hidden');
        displayWord();
    }

    // Populated once the data has been fetched (see the init block at the end).
    let vocabulary = [];

    // Shuffle array
    function shuffleArray(array) {
        const shuffled = [...array];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
    }

    // Initialize session-based tracking (filled in by the init block once data loads)
    let shuffledVocabulary = [];
    let remainingWords = []; // Queue of words to be answered correctly
    let masteredWords = new Set(); // Track words answered correctly
    let stats = {correct: 0, incorrect: 0};

    function updateStats() {
        const total = stats.correct + stats.incorrect;
        const rate = total > 0 ? Math.round((stats.correct / total) * 100) : 0;

        let emoji = '😊'; // Default starting happy
        if (total > 0) {
            if (rate === 100) emoji = '😄';
            else if (rate >= 90) emoji = '😊';
            else if (rate >= 70) emoji = '🙂';
            else if (rate >= 50) emoji = '😐';
            else if (rate >= 30) emoji = '🙁';
            else emoji = '😢';
        }

        document.getElementById('smiley').textContent = emoji;
    }

    function displayWord() {
        // No words match the current filter — show an empty state instead of
        // the completion screen (which would imply the session was finished).
        if (shuffledVocabulary.length === 0) {
            document.getElementById('german-word').textContent = '🤷';
            document.getElementById('progress-text').textContent =
                'Keine Vokabeln für diese Auswahl.';
            document.getElementById('progress-bar').style.width = '0%';
            document.getElementById('progress-bar').textContent = '';
            document.getElementById('answer-input').value = '';
            document.getElementById('answer-input').disabled = true;
            document.getElementById('feedback').textContent = '';
            document.getElementById('check-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            return;
        }

        // Check if session is complete
        if (remainingWords.length === 0) {
            showCompletionScreen();
            return;
        }

        const word = remainingWords[0];
        document.getElementById('german-word').textContent = word.german;

        // Update progress bar and text
        const totalWords = shuffledVocabulary.length;
        const remainingCount = remainingWords.length;
        const completedCount = totalWords - remainingCount;
        const progressPercent = (completedCount / totalWords) * 100;

        const progressBar = document.getElementById('progress-bar');
        progressBar.style.width = progressPercent + '%';
        progressBar.textContent = completedCount > 0 ? Math.round(progressPercent) + '%' : '';

        document.getElementById('progress-text').textContent =
            `${remainingCount} von ${totalWords} verbleibend`;

        // Reset input
        const input = document.getElementById('answer-input');
        input.value = '';
        input.className = '';
        input.disabled = false;
        input.focus();

        // Reset feedback
        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';

        // Reset buttons
        document.getElementById('check-btn').style.display = 'inline-block';
        document.getElementById('next-btn').style.display = 'none';

        // Disable prev button in session-based mode
        document.getElementById('prev-btn').disabled = true;
    }

    function checkAnswer() {
        const input = document.getElementById('answer-input');

        // Normalize function: expand contractions, remove punctuation and extra spaces
        const normalize = (str) => {
            return str
                .toLowerCase()
                // Expand common contractions
                .replace(/you're/g, 'you are')
                .replace(/she's/g, 'she is')
                .replace(/he's/g, 'he is')
                .replace(/it's/g, 'it is')
                .replace(/they're/g, 'they are')
                .replace(/we're/g, 'we are')
                .replace(/i'm/g, 'i am')
                .replace(/isn't/g, 'is not')
                .replace(/aren't/g, 'are not')
                .replace(/wasn't/g, 'was not')
                .replace(/weren't/g, 'were not')
                .replace(/don't/g, 'do not')
                .replace(/doesn't/g, 'does not')
                .replace(/didn't/g, 'did not')
                // Remove slashes between words (like "he/she/it")
                .replace(/\//g, ' ')
                // Remove punctuation
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()\?]/g, '')
                // Normalize whitespace
                .replace(/\s+/g, ' ')
                .trim();
        };

        const currentWord = remainingWords[0];
        const userAnswer = normalize(input.value);

        // Split correct answer by "/" to handle alternatives (e.g., "a lot of / lots of")
        const correctAnswerVariants = currentWord.english
            .split('/')
            .map(variant => normalize(variant.trim()));

        if (!userAnswer) return;

        // Check if user answer matches any of the acceptable variants
        const isCorrect = correctAnswerVariants.some(variant => userAnswer === variant);

        // Motivational messages
        const correctMessages = ['Super!', 'Perfekt!', 'Fantastisch!', 'Klasse!', 'Toll gemacht!', 'Genau richtig!', 'Sehr gut!'];
        const incorrectMessages = ['Fast richtig!', 'Versuch\'s nochmal!', 'So nah dran!', 'Nicht aufgeben!', 'Weiter so!'];

        // Update UI
        input.className = isCorrect ? 'correct bounce' : 'incorrect shake';
        input.disabled = true;

        const feedback = document.getElementById('feedback');
        const card = document.getElementById('quiz-card');

        if (isCorrect) {
            // Random motivational message for correct answer
            const randomMessage = correctMessages[Math.floor(Math.random() * correctMessages.length)];
            feedback.textContent = randomMessage;
            feedback.className = 'feedback correct fade-in-bounce';
            stats.correct++;

            // Bounce animation
            input.classList.add('bounce');
            setTimeout(() => input.classList.remove('bounce'), 400);

            // Remove from remaining words and add to mastered
            remainingWords.shift();
            masteredWords.add(currentWord.german);
        } else {
            // Random encouraging message for incorrect answer
            const randomMessage = incorrectMessages[Math.floor(Math.random() * incorrectMessages.length)];
            feedback.textContent = `${randomMessage} Richtig: ${currentWord.english}`;
            feedback.className = 'feedback incorrect fade-in-bounce';
            stats.incorrect++;

            // Shake animations
            input.classList.add('shake');
            card.classList.add('shake');
            setTimeout(() => {
                input.classList.remove('shake');
                card.classList.remove('shake');
            }, 500);

            // Move word to end of queue (remove from front, add to back)
            remainingWords.shift();
            remainingWords.push(currentWord);
        }

        // Update stats
        updateStats();

        // Update buttons
        document.getElementById('check-btn').style.display = 'none';
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('next-btn').focus();
    }

    function nextWord() {
        // Simply display the next word (or completion screen if done)
        displayWord();
    }

    function previousWord() {
        // Previous button disabled in session-based mode
        // No action needed
    }

    function showCompletionScreen() {
        // Hide quiz card, show completion screen
        document.getElementById('quiz-card').classList.add('hidden');
        document.getElementById('completion-screen').classList.add('active');

        // Update completion stats
        document.getElementById('session-correct').textContent = stats.correct;
        document.getElementById('session-incorrect').textContent = stats.incorrect;

        const total = stats.correct + stats.incorrect;
        const rate = total > 0 ? Math.round((stats.correct / total) * 100) : 0;
        document.getElementById('session-rate').textContent = rate + '%';
    }

    function startNewSession() {
        // Reset session data
        shuffledVocabulary = shuffleArray(vocabulary);
        remainingWords = [...shuffledVocabulary];
        masteredWords.clear();
        stats = {correct: 0, incorrect: 0};

        // Update UI
        updateStats();

        // Hide completion screen, show quiz card
        document.getElementById('completion-screen').classList.remove('active');
        document.getElementById('quiz-card').classList.remove('hidden');

        // Display first word
        displayWord();
    }

    // Keyboard support
    document.getElementById('answer-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const checkBtn = document.getElementById('check-btn');
            const nextBtn = document.getElementById('next-btn');

            if (checkBtn.style.display !== 'none') {
                checkAnswer();
            } else if (nextBtn.style.display !== 'none') {
                nextWord();
            }
        }
    });

    // Initialize on load: fetch the vocabulary data, then start the session.
    (async () => {
        try {
            allPages = loadAllPages();
        } catch (err) {
            console.error(err);
            document.getElementById('progress-text').textContent =
                'Vokabeln konnten nicht geladen werden.';
            return;
        }

        // initializeFilter() restores the saved filter, populates the controls,
        // and calls reloadFromFilter() which builds the session and renders.
        initializeFilter();
        updateStats();
    })();
</script>
</body>
</html>
